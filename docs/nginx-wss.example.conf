# Exemplo para um deploy futuro do Via Láctea TD by Suntinus.
# Este arquivo NÃO está aplicado. O processo do jogo continua só em
# 127.0.0.1:8030 e só sobe em produção com GO do founder.
#
# O proxy termina TLS (wss) e encaminha o WebSocket para o Node local.
# proxy_read_timeout / proxy_send_timeout cobrem a partida e o ping de 25s.
# O processo só confia em X-Forwarded-For e X-Real-IP quando o peer é loopback.

server {
    listen 443 ssl;
    server_name jogo.example.com;

    # ssl_certificate     /etc/letsencrypt/live/jogo.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jogo.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
